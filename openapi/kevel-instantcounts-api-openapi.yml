  /v1/instantcounts/bulk:
    post:
      summary: Get Bulk Counts
      description: This returns real time reporting data for more than one advertiser, campaign, flight, or ad. You can request as many as you need from each category.
      operationId: get-bulk-counts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                advertisers:
                  type: array
                  description: IDs of advertisers you want data on
                  items:
                    type: integer
                    format: int32
                campaigns:
                  type: array
                  description: IDs of campaigns you want data on
                  items:
                    type: integer
                    format: int32
                flights:
                  type: array
                  description: IDs of flights you want data on
                  items:
                    type: integer
                    format: int32
                ads:
                  type: array
                  description: IDs of ads you want data on
                  items:
                    type: integer
                    format: int32
                days:
                  type: string
                  description: Request data broken out by day for past number of days (current day is 0).
                start:
                  type: string
                  description: Day you want to start getting data from in YYYY-MM-DD
                end:
