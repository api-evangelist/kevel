openapi: 3.2.0
info:
  title: management-api-2 Instantcounts API
  version: '1.0'
servers:
- url: https://api.kevel.co
security:
- sec0: []
tags:
- name: Instantcounts
paths:
  /v1/instantcounts/advertiser/{AdvertiserID}:
    get:
      summary: Get Advertiser Counts
      description: This returns real time reporting data for an advertiser.
      operationId: get-advertiser-counts
      parameters:
      - name: AdvertiserID
        in: path
        description: ID of the Advertiser
        schema:
          type: integer
          format: int32
        required: true
      - name: days
        in: query
        description: Returns data for the number of days since the current day. You can request a maximum of 90 days of data and a minimum of 0. `days=0` returns data for the current day.
        schema:
          type: integer
          format: int32
      - name: start
        in: query
        description: In the format of YYYY-MM-DD. Returns data starting from the date specified. Must be within the past 90 days. If no `end` is included, this will return data up to the current day.
        schema:
          type: string
      - name: end
        in: query
        description: In the format of YYYY-MM-DD. Returns data ending at the date specified. Must be within the past 90 days.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"advertisers\": {\n    \"123\": {\n      \"impressions\": 3097,\n      \"conversions\": 12,\n      \"revenue\": 49.11279,\n      \"clicks\": 149\n    }\n  }\n}"
                200 OK - Multi Day:
                  value: "{\n  \"advertisers\": {\n    \"123\": {\n      \"2017-04-18\": {\n        \"impressions\": 1,\n        \"conversions\": 1,\n        \"revenue\": 0,\n        \"clicks\": 0\n      },\n      \"2017-04-19\": {\n        \"impressions\": 2,\n        \"conversions\": 0,\n        \"revenue\": 0,\n        \"clicks\": 2\n      },\n      \"2017-04-20\": {\n        \"impressions\": 3,\n        \"conversions\": 0,\n        \"revenue\": 0,\n        \"clicks\": 0\n      },\n      \"total\": {\n        \"impressions\": 6,\n        \"conversions\": 1,\n        \"revenue\": 0,\n        \"clicks\": 2\n      }\n    }\n  }\n}"
              schema:
                oneOf:
                - type: object
                  properties:
                    advertisers:
                      type: object
                      properties:
                        '123':
                          type: object
                          properties:
                            impressions:
                              type: integer
                              example: 3097
                              default: 0
                            conversions:
                              type: integer
                              example: 12
                              default: 0
                            revenue:
                              type: number
                              example: 49.11279
                              default: 0
                            clicks:
                              type: integer
                              example: 149
                              default: 0
                - title: 200 OK - Multi Day
                  type: object
                  properties:
                    advertisers:
                      type: object
                      properties:
                        '123':
                          type: object
                          properties:
                            '2017-04-18':
                              type: object
                              properties:
                                impressions:
                                  type: integer
                                  example: 1
                                  default: 0
                                conversions:
                                  type: integer
                                  example: 1
                                  default: 0
                                revenue:
                                  type: integer
                                  example: 0
                                  default: 0
                                clicks:
                                  type: integer
                                  example: 0
                                  default: 0
                            '2017-04-19':
                              type: object
                              properties:
                                impressions:
                                  type: integer
                                  example: 2
                                  default: 0
                                conversions:
                                  type: integer
                                  example: 0
                                  default: 0
                                revenue:
                                  type: integer
                                  example: 0
                                  default: 0
                                clicks:
                                  type: integer
                                  example: 2
                                  default: 0
                            '2017-04-20':
                              type: object
                              properties:
                                impressions:
                                  type: integer
                                  example: 3
                                  default: 0
                                conversions:
                                  type: integer
                                  example: 0
                                  default: 0
                                revenue:
                                  type: integer
                                  example: 0
                                  default: 0
                                clicks:
                                  type: integer
                                  example: 0
                                  default: 0
                            total:
                              type: object
                              properties:
                                impressions:
                                  type: integer
                                  example: 6
                                  default: 0
                                conversions:
                                  type: integer
                                  example: 1
                                  default: 0
                                revenue:
                                  type: integer
                                  example: 0
                                  default: 0
                                clicks:
                                  type: integer
                                  example: 2
                                  default: 0
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: 'curl -X GET -H ''X-Adzerk-ApiKey:<API-KEY>'' ''https://api.kevel.co/v1/instantcounts/advertiser/123''


            # Using Days

            curl -X GET -H ''X-Adzerk-ApiKey:<API-KEY>'' ''https://api.kevel.co/v1/instantcounts/advertiser/123?days=42''


            # Using Start/End

            curl -X GET -H ''X-Adzerk-ApiKey:<API-KEY>'' ''https://api.kevel.co/v1/instantcounts/advertiser/123?start=2017-04-18&end=2017-04-20'''
        - language: javascript
          code: "const Adzerk = require('@adzerk/management-sdk');\nconst apiKey = process.env.ADZERK_API_KEY;\n\nasync function getAdvertiserCounts() {\n  let specifications = await Adzerk.fetchSpecifications();\n  let client = await Adzerk.buildClient({apiKey, specifications});\n\n  let counts = await client.run(\"realTimeReport\", \"getAdvertiserCounts\", {\n    advertiserId: 123\n  });\n\n  console.log(counts);\n}\n\ngetAdvertiserCounts();"
        - language: ruby
          code: "require \"adzerk\"\n\ndef get_advertiser_counts()\n    client = Adzerk::Client.new(ENV[\"ADZERK_API_KEY\"])\n    advertiser_id = 123\n    data = {\n        days: 7\n    }\n    pp client.advertisers.instant_counts(advertiser_id, data)\nend\nget_advertiser_counts()"
        samples-languages:
        - curl
        - javascript
        - ruby
      tags:
      - Instantcounts
