  /v1/instantcounts/network:
    get:
      summary: Get Network Counts
      description: This returns real time reporting data for all campaigns, flights and ads in a network, aggregated as a total of impressions, clicks etc.
      operationId: get-network-counts
      parameters:
      - name: days
        in: query
        description: Returns data for the number of days since the current day. You can request a maximum of 90 days of data and a minimum of 0. `days=0` returns data for the current day.
        schema:
          type: integer
          format: int32
      - name: start
        in: query
        description: In the format of YYYY-MM-DD. Returns data starting from the date specified. Must be within the past 90 days. If no `end` is included, this will return data up to the current day.
        schema:
          type: string
      - name: end
        in: query
        description: In the format of YYYY-MM-DD. Returns data ending at the date specified. Must be within the past 90 days.
        schema:
          type: string
      responses:
        '200':
          description: '200'
