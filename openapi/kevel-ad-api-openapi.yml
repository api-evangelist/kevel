openapi: 3.2.0
info:
  title: management-api-2 Ad API
  version: '1.0'
servers:
- url: https://api.kevel.co
security:
- sec0: []
tags:
- name: Ad
paths:
  /v1/ad/{AdID}:
    get:
      summary: Get Ad
      description: ''
      operationId: get-ad-1
      parameters:
      - name: AdID
        in: path
        description: ID of the Ad / Creative Flight Map. This is not the ID from Create Creatives.
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"Id\": 1227159,\n  \"CampaignId\": 258367,\n  \"FlightId\": 616145,\n  \"ZoneId\": 12345,\n  \"SiteId\": 1234,\n  \"Iframe\": null,\n  \"Impressions\": 0,\n  \"Percentage\": 0,\n  \"DistributionType\": 1,\n  \"IsDeleted\": false,\n  \"IsActive\": false,\n  \"Creative\": {\n    \"Id\": 1163487,\n    \"Title\": \"Adzerk Blue Creative\",\n    \"ImageName\": \"\",\n    \"Url\": \"https://adzerk.com\",\n    \"Body\": \"\",\n    \"AdvertiserId\": 84825,\n    \"IsActive\": null,\n    \"AdTypeId\": 5,\n    \"Alt\": \"Adzerk - Native Ads\",\n    \"IsDeleted\": null,\n    \"IsSync\": null,\n    \"IsHTMLJS\": true,\n    \"ScriptBody\": \"this\",\n    \"Metadata\": null,\n    \"ImageLink\": \"httpss://static.adzerk.net/Advertisers/\",\n    \"IsNoTrack\": true,\n    \"IsNetworkAd\": false\n  },\n  \"CustomTargeting\": \"$keywords contains \\\"dean\\\"\",\n  \"FreqCap\": 5,\n  \"FreqCapDuration\": 1,\n  \"FreqCapType\": 2,\n  \"StartDate\": \"/Date(1430481600000)/\",\n  \"EndDate\": \"/Date(1430827200000)/\",\n  \"GoalType\": 1,\n  \"Goal\": 200000,\n  \"Price\": 1,\n  \"IsGoalOverride\": true,\n  \"IsStartEndDateOverride\": true,\n  \"ActiveKeywords\": [\"kittens\", \"cats\"],\n  \"RtbCustomFields\": null\n}"
              schema:
                type: object
                properties:
                  Id:
                    type: integer
                    example: 1227159
                    default: 0
                  CampaignId:
                    type: integer
                    example: 258367
                    default: 0
                  FlightId:
                    type: integer
                    example: 616145
                    default: 0
                  ZoneId:
                    type: integer
                    example: 12345
                    default: 0
                  SiteId:
                    type: integer
                    example: 1234
                    default: 0
                  Iframe: {}
                  Impressions:
                    type: integer
                    example: 0
                    default: 0
                  Percentage:
                    type: integer
                    example: 0
                    default: 0
                  DistributionType:
                    type: integer
                    example: 1
                    default: 0
                  IsDeleted:
                    type: boolean
                    example: false
                    default: true
                  IsActive:
                    type: boolean
                    example: false
                    default: true
                  Creative:
                    type: object
                    properties:
                      Id:
                        type: integer
                        example: 1163487
                        default: 0
                      Title:
                        type: string
                        example: Adzerk Blue Creative
                      ImageName:
                        type: string
                        example: ''
                      Url:
                        type: string
                        example: https://adzerk.com
                      Body:
                        type: string
                        example: ''
                      AdvertiserId:
                        type: integer
                        example: 84825
                        default: 0
                      IsActive: {}
                      AdTypeId:
                        type: integer
                        example: 5
                        default: 0
                      Alt:
                        type: string
                        example: Adzerk - Native Ads
                      IsDeleted: {}
                      IsSync: {}
                      IsHTMLJS:
                        type: boolean
                        example: true
                        default: true
                      ScriptBody:
                        type: string
                        example: this
                      Metadata: {}
                      ImageLink:
                        type: string
                        example: httpss://static.adzerk.net/Advertisers/
                      IsNoTrack:
                        type: boolean
                        example: true
                        default: true
                      IsNetworkAd:
                        type: boolean
                        example: false
                        default: true
                  CustomTargeting:
                    type: string
                    example: $keywords contains "dean"
                  FreqCap:
                    type: integer
                    example: 5
                    default: 0
                  FreqCapDuration:
                    type: integer
                    example: 1
                    default: 0
                  FreqCapType:
                    type: integer
                    example: 2
                    default: 0
                  StartDate:
                    type: string
                    example: /Date(1430481600000)/
                  EndDate:
                    type: string
                    example: /Date(1430827200000)/
                  GoalType:
                    type: integer
                    example: 1
                    default: 0
                  Goal:
                    type: integer
                    example: 200000
                    default: 0
                  Price:
                    type: integer
                    example: 1
                    default: 0
                  IsGoalOverride:
                    type: boolean
                    example: true
                    default: true
                  IsStartEndDateOverride:
                    type: boolean
                    example: true
                    default: true
                  ActiveKeywords:
                    type: array
                    items:
                      type: string
                      example: kittens
                  RtbCustomFields: {}
                  CategoryTargeting:
                    type: array
                    description: The category targeting rules saved on the Ad itself, each with an `Id` and `IsExclude`. An Ad with no rules of its own uses its Flight's rules, and they do not appear here. Left out when category targeting is not enabled for your network.
                    items:
                      type: object
                      properties:
                        Id:
                          type: string
                          description: The category the rule matches.
                        IsExclude:
                          type: boolean
                          description: '`true` for an exclude rule, `false` for an include rule.'
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X GET -H 'X-Adzerk-ApiKey:<APIKEY>' "https://api.kevel.co/v1/ad/123456"
        - language: javascript
          code: "const Adzerk = require('@adzerk/management-sdk');\nconst apiKey = process.env.ADZERK_API_KEY;\n\nasync function getAd() {\n  let specifications = await Adzerk.fetchSpecifications();\n  let client = await Adzerk.buildClient({apiKey, specifications});\n\n  let ad = await client.run('ad', 'get', {id: 12345});\n  console.log(ad);\n}\n\ngetAd();"
        - language: ruby
          code: "require \"adzerk\"\n\ndef get_ad()\n    client = Adzerk::Client.new(ENV[\"ADZERK_API_KEY\"])\n    ad_id = 12345\n    flight_id = 67890\n    pp client.ads.get(ad_id, flight_id)\nend\nget_ad()"
        samples-languages:
        - curl
        - javascript
        - ruby
      tags:
      - Ad
  /v1/ad/{AdID}/tracking-urls:
    get:
      summary: Get Ad Tracking Pixel and ClickURL
      description: ''
      operationId: get-ad-tracking-pixel-and-clickurl
      parameters:
      - name: AdID
        in: path
        description: The ad ID (or creative flight map). Note that this is not the creative ID.
        schema:
          type: integer
          format: int32
        required: true
      - name: siteid
        in: query
        description: The site in your network where the impression and/or click should be tracked. The site must be eligible to serve the ad (i.e. the ad's flight belongs to a channel the site is associated with).
        required: true
        schema:
          type: integer
          format: int32
      - name: zoneid
        in: query
        description: An optional zone where the impression and/or click should be tracked. Must belong to the `siteid`.
        schema:
          type: integer
          format: int32
      - name: keywords
        in: query
        description: A comma separated string of keywords, like `foo,bar,baz`, that will be tracked in reporting with the click and/or impression. Keywords must not contain [disallowed characters defined in the keyword documentation.](doc:keyword-targeting#keywords-and-special-characters)
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"Id\": 1234567,\n  \"StaticClickUrl\": \"https://e-1234.adzerk.net/r?e=eyJhdiI6MjMwNjIsImF0IjoyMCwiYnQiOjAsImNtIjo...&s=FOw8LAsm9ns2zM3THky6Dxvg0jc\",\n  \"ImpressionPixelUrl\": \"https://e-1234.adzerk.net/p/eyJhdiI6MjMwNjIsImF0.../i.gif\"\n}"
              schema:
                type: object
                properties:
                  Id:
                    type: integer
                    example: 1234567
                    default: 0
                  StaticClickUrl:
                    type: string
                    example: https://e-1234.adzerk.net/r?e=eyJhdiI6MjMwNjIsImF0IjoyMCwiYnQiOjAsImNtIjo...&s=FOw8LAsm9ns2zM3THky6Dxvg0jc
                  ImpressionPixelUrl:
                    type: string
                    example: https://e-1234.adzerk.net/p/eyJhdiI6MjMwNjIsImF0.../i.gif
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"This ad is not active.\"\n}\n\n{\n  \"message\": \"This ad does not belong to your network.\"\n}\n\n{\n  \"message\": \"Site ID must be an integer.\"\n}\n\n{\n  \"message\": \"This site does not belong to your network.\"\n}\n\n{\n  \"message\": \"This site is not associated with a channel that includes this ad.\"\n}\n\n{\n  \"message\": \"Zone ID must be an integer.\"\n}\n\n{\n  \"message\": \"This zone does not belong to your network.\"\n}\n\n{\n  \"message\": \"This zone does not belong to this site.\"\n}\n\n{\n  \"message\": \"The keyword \\\":foo\\\" contains a character that is not allowed: ':'\"\n}\n\n{\n  \"message\": \"The keyword \\\" foo\\\" is invalid because it starts with whitespace.\"\n}"
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"The tracking URLs you have requested are not available. This may indicate the Ad has not yet been fully published. Please retry your request based on the Retry-After header.\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The tracking URLs you have requested are not available. This may indicate the Ad has not yet been fully published. Please retry your request based on the Retry-After header.
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: '## Requesting the ad for an eligible site:

            curl -s -H "X-Adzerk-ApiKey:<API-KEY>" "https://api.kevel.co/v1/ad/123456/tracking-urls?siteid=123456"


            ## Requesting the ad for a site, zone, and keywords:

            curl -s -H "X-Adzerk-ApiKey:<API-KEY>" "https://api.kevel.co/v1/ad/123456/tracking-urls?siteid=123456&zoneid=12345&keywords=foo,bar,baz"'
        - language: javascript
          code: "const Adzerk = require('@adzerk/management-sdk');\nconst apiKey = process.env.ADZERK_API_KEY;\n\nasync function getTrackingUrls() {\n  let specifications = await Adzerk.fetchSpecifications();\n  let client = await Adzerk.buildClient({apiKey, specifications});\n\n  let urls = await client.run('ad', 'getTrackingUrls', {id: 12345, siteid: 67890});\n  console.log(urls);\n}\n\ngetTrackingUrls();"
        samples-languages:
        - curl
        - javascript
      tags:
      - Ad
