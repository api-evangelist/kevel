  /v1/ad/{AdId}/segmenttargeting:
    post:
      summary: Create Ad Segment Targeting Rule
      description: Create an Ad to Segment targeting rule
      operationId: create-ad-segment
      parameters:
      - name: AdId
        in: path
        description: The Ad the targeting rule applies to
        schema:
          type: integer
          format: int32
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - SegmentId
              properties:
                SegmentId:
                  type: integer
                  description: Id of the Segment
                  format: int32
                IsExclude:
                  type: boolean
                  description: Whether targeting is to be excluded or included
                  default: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \t\"Id\": 56789,\n\t\t\"AdId\": 55555,\n    \"SegmentId\": 123456,\n    \"IsExclude\": false,\n\t\t\"Segment\":\n        \t{\n\t\t\t\t\t\t\"Source\": \"audience\",\n  \t\t\t\t\t\"Name\": \"best customers\",\n  \t\t\t\t\t\"Reach\": { \"all_time\": 3187463, \"28d\": 387434 },\n  \t\t\t\t\t\"Description\": \"top 1% spenders in the last 30 days.\",\n  \t\t\t\t\t\"Category\": \"CRM\"\n\t\t\t\t\t}\n}"
              schema:
                type: object
                properties:
                  Id:
                    type: integer
                    example: 56789
                    default: 0
                  AdId:
                    type: integer
                    example: 55555
                    default: 0
                  SegmentId:
                    type: integer
                    example: 123456
                    default: 0
                  IsExclude:
                    type: boolean
                    example: false
                    default: 'false'
                  Segment:
                    type: object
                    properties:
                      Source:
                        type: string
                        example: audience
                      Name:
                        type: string
                        example: best customers
                      Reach:
                        type: object
                        properties:
                          all_time:
                            type: integer
                            example: 3187463
                            default: 0
                          28d:
                            type: integer
                            example: 387434
                            default: 0
                      Description:
                        type: string
                        example: top 1% spenders in the last 30 days.
                      Category:
                        type: string
                        example: CRM
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X POST -H "X-Adzerk-ApiKey:<APIKEY>" -H "Content-Type:application/json" https://api.kevel.co/v1/ad/{AdId}/segmenttargeting --data-binary '{"SegmentId":123456,"IsExclude":false}'
        - language: javascript
          code: "// coming soon to @adzerk-management-sdk\n\nconst Adzerk = require('@adzerk/management-sdk');\nconst apiKey = process.env.ADZERK_API_KEY;\n\nasync function createAdSegment() {\n  let specifications = await Adzerk.fetchSpecifications();\n  let client = await Adzerk.buildClient({apiKey, specifications});\n\n  let targetingRule = await client.run(\"adSegment\", \"create\", {\n    segmentId:123456,\n    isExclude: false\n  });\n\n  console.log(targetingRule);\n}\n\ncreateAdSegment();"
        - language: ruby
          code: "## coming soon to @adzerk-management-sdk\n\nrequire \"adzerk\"\n\ndef create_ad_segment()\n    client = Adzerk::Client.new(ENV[\"ADZERK_API_KEY\"])\n    pp client.adSegment.create(segmentId: 123456, isExclude: false)\nend\ncreate_ad_segment()"
        samples-languages:
        - curl
        - javascript
        - ruby
      tags:
      - Ad
    get:
      summary: List Ad Segment Targeting Rules
      description: List all Segment targeting rules for an Ad
      operationId: list-ad-segments
      parameters:
      - name: AdId
        in: path
        description: The Ad the targeting rule applies to
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"page\":1,\n  \"items\": [\n\t\t\t{\n\t\t\t\t\"Id\": 56789,\n\t\t\t\t\"AdId\": 55555,\n    \t\t\"SegmentId\": 123456,\n        \"IsExclude\": false,\n        \"Segment\":\n        \t{\n\t\t\t\t\t\t\"Source\": \"audience\",\n  \t\t\t\t\t\"Name\": \"best customers\",\n  \t\t\t\t\t\"Reach\": { \"all_time\": 3187463, \"28d\": 387434 },\n  \t\t\t\t\t\"Description\": \"top 1% spenders in the last 30 days.\",\n  \t\t\t\t\t\"Category\": \"CRM\"\n\t\t\t\t\t}\n\t\t\t}\n    ],\n    \"pageSize\":1,\n    \"totalPages\":1,\n\t\t\"totalItems\":1\n}"
              schema:
                type: object
                properties:
                  page:
                    type: integer
                    example: 1
                    default: 0
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          type: integer
                          example: 56789
                          default: 0
                        AdId:
                          type: integer
                          example: 55555
                          default: 0
                        SegmentId:
                          type: integer
                          example: 123456
                          default: 0
                        IsExclude:
                          type: boolean
                          example: false
                          default: 'false'
                        Segment:
                          type: object
                          properties:
                            Source:
                              type: string
                              example: audience
                            Name:
                              type: string
                              example: best customers
                            Reach:
                              type: object
                              properties:
                                all_time:
                                  type: integer
                                  example: 3187463
                                  default: 0
                                28d:
                                  type: integer
                                  example: 387434
                                  default: 0
                            Description:
                              type: string
                              example: top 1% spenders in the last 30 days.
                            Category:
                              type: string
                              example: CRM
                  pageSize:
                    type: integer
                    example: 1
                    default: 0
                  totalPages:
                    type: integer
                    example: 1
                    default: 0
                  totalItems:
                    type: integer
                    example: 1
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X GET -H "X-Adzerk-ApiKey:<APIKEY>" "https://api.kevel.co/v1/ad/{AdId}/segmenttargeting"
        - language: javascript
          code: "const Adzerk = require('@adzerk/management-sdk');\nconst apiKey = process.env.ADZERK_API_KEY;\n\nasync function listAdSegment() {\n  let specifications = await Adzerk.fetchSpecifications();\n  let client = await Adzerk.buildClient({apiKey, specifications});\n\n  let targetingRule = await client.run('adSegment', 'list');\n  console.log(targetingRule);\n}\n\nlistAdSegment();"
        - language: ruby
          code: "require \"adzerk\"\n\ndef list_ad_segment()\n    client = Adzerk::Client.new(ENV[\"ADZERK_API_KEY\"])\n    pp client.ad_segments.list()\nend\nlist_ad_segment()"
        samples-languages:
        - curl
        - javascript
        - ruby
      tags:
      - Ad
  /v1/ad/{AdId}/segmenttargeting/{Id}:
