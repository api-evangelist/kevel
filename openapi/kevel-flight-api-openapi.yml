openapi: 3.2.0
info:
  title: management-api-2 Flight API
  version: '1.0'
servers:
- url: https://api.kevel.co
security:
- sec0: []
tags:
- name: Flight
paths:
  /v1/flight:
    post:
      summary: Create Flight
      description: This API call adds a new flight to a campaign.
      operationId: create-flight
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - Name
              - StartDateISO
              - CampaignId
              - PriorityId
              - GoalType
              - Impressions
              - IsActive
              - RateType
              properties:
                Name:
                  type: string
                  description: The flight name. Max length is 300 characters.
                StartDateISO:
                  type: string
                  description: 'UTC start date in ISO 8601 format:  `YYYY-MM-DDTHH:MM:SS.SSSSSSS`. This can also be sent in the format of `YYYY-MM-DD`.'
                CampaignId:
                  type: integer
                  description: The ID of the campaign.
                  format: int32
                PriorityId:
                  type: integer
                  description: The ID of the [Priority](doc:priorities). Here are the [Priority API endpoints](ref:priority).
                  format: int32
                GoalType:
                  type: integer
                  description: 'This is the metric that Kevel uses to pace the ads so it hits the desired goal by the end date.  Key follows: `1 = Impressions 2 = Percentage 3 = Click 7 = Conversion 8 = Revenue 9 = Daily Revenue  10 = Monthly Revenue`. Instructions are [here](doc:flights#goals)'
                  format: int32
                Impressions:
                  type: integer
                  description: 'The goal amount - specifies the number of GoalTypes to aim for during the life of the campaign. For Revenue, Daily Revenue and Monthly Revenue Goal Types the maximum Goal Amount is 500000000. For all other GoalTypes the maximum Goal Amount is 2147483647. Instructions are [here](doc:flights#goals). Note: the field is named Impressions even if Goal Type is not set to Impressions.'
                  format: int32
                IsActive:
                  type: boolean
                  description: Specifies whether campaigns should be active or inactive. Defaults to `false`.
                  default: false
                RateType:
                  type: integer
                  description: 'The Rate value - instructions [here](doc:flights#rateprice). Key: `1 = Flat 2 = CPM 3 = CPC 4 = CPA View 5 = CPA Click 6 = CPA View & Click`.'
                  format: int32
                EndDateISO:
                  type: string
                  description: 'UTC end date in ISO 8601 format: ``YYYY-MM-DDTHH:MM:SS.SSSSSSS`. You can also send in a standard date of `YYYY-MM-DD`. **Required** if `GoalType` is not `2`, `9` or `10`.'
                IsDeleted:
                  type: boolean
                  description: Specifies whether flight should be deleted. Do not use when creating a flight. Defaults to `false`.
                  default: false
                Price:
                  type: number
                  description: The Price value - instructions [here](doc:flights#rateprice).
                  format: float
                CapType:
                  type: integer
                  description: 'The cap type metric. Instructions [here](doc:flights#caps). Key: `1 = Impressions 2 = Clicks 3 = Conversions 4 = Revenue`. Do not set to `0` - if removing, set to `null`.'
                  format: int32
                DailyCapAmount:
                  type: integer
                  description: 'The maximum # of `CapType` per day. Instructions [here](doc:flights#caps).'
                  format: int32
                LifetimeCapAmount:
                  type: integer
                  description: 'The maximum # of `CapType` per lifetime.  Instructions [here](doc:flights#caps).'
                  format: int32
                Keywords:
                  type: string
                  description: Keywords used for targeting. Instructions [here](https://dev.kevel.com/docs/keyword-targeting).
                CustomTargeting:
                  type: string
                  description: Zerkel string for Custom targeting. Instructions [here](https://dev.kevel.com/docs/custom-targeting). The maximum string length for `CustomTargeting` is 1000 characters.
                CustomFieldsJSON:
                  type: string
                  description: Sets the value of custom fields based on a custom fields schema. Must contact support before use. More info [here](doc:custom-fields).
                IsFreqCap:
                  type: boolean
                  description: Set to `true` if doing capping. If false or null, then the other Freq fields are ignored. Learn more about FC [here](https://dev.kevel.com/docs/flight-frequency-capping). If not already enabled, you'll need your account manager to enable it.
                FreqCap:
                  type: integer
                  description: The number of times the frequency cap should occur. Cannot be 0 unless `FreqCapType` is None (0).
                  format: int32
                FreqCapDuration:
                  type: integer
                  description: Specifies how often the frequency cap should occur. Cannot be 0 unless `FreqCapType` is None (0).
                  format: int32
                FreqCapType:
                  type: integer
                  description: 'Specifies which unit of time you would like frequency capping to occur. Key: `1 = Hour 2 = Day 3 = Minute`.'
                  format: int32
                DontAffectParentFreqCap:
                  type: boolean
                  description: If true, opts-it out of frequency cap settings imposed at advertiser or campaign level.
                IsCompanion:
                  type: boolean
                  description: If `true`, enables companion ads. `IsCompanion` must be set to `false` when `IsNoDuplicates` is `true`, and vice versa. Learn more [here](doc:additional-display-rules#companion-ads).
                isNoDuplicates:
                  type: boolean
                  description: If `true`, enables no duplicates. `IsCompanion` must be set to `false` when `IsNoDuplicates` is true, and vice versa.
                DuplicateMode:
                  type: integer
                  description: 'Indicates which level no duplicates should be enforced on. Key follows: `1: Flight 2: Campaign 3: Advertiser 4: Creative`.'
                  format: int32
                DeliveryStatus:
                  type: integer
                  description: 'Read-only. Status of the flight. The mapping of the status against the [UI](https://dev.kevel.com/docs/campaigns#flights-and-ads) are in brackets. Key: 0 = Pending (blue) 1 = Healthy (green) 2 = BorderLine (amber) 3 = InDanger (red) 5 = Underdelivered (amber).'
                  format: int32
                IsTrackingConversions:
                  type: boolean
                  description: If `true`, enables conversion tracking endpoints/pixels.
                CanPassback:
                  type: boolean
                  description: Sets whether a flight in an adChained-enabled priority can pass back to the next flight in the adChain.
                PassbackSortOrder:
                  type: integer
                  description: Sets the order of a flight in the adChain. `PassbackSortOrder` is a transient value that can be modified by internal processes in the UI. Although the value may change, the actual sort order of flights in the adChain will remain consistent. Setting two flights to the same `PassbackSortOrder` will cause the flights to be chosen randomly. Setting `PassbackSortOrder` to `0` will cause the flight to appear as `"--"` in the UI, but the flight will still be part of the adChain. This is not recommended.
                  format: int32
                IsECPMOptimized:
                  type: boolean
                  description: Specifies whether `ECPM Optimization` is enabled.
                ECPMOptimizePeriod:
                  type: integer
                  description: Timeframe to optimize for [1 - 90 days].
                  format: int32
                ECPMMultiplier:
                  type: number
                  description: The final eCPM will be multiplied by this amount. Must be at least 0.01.
                  format: float
                FloorECPM:
                  type: number
                  description: Minimum eCPM. Must be at least 0.01.
                  format: float
                CeilingECPM:
                  type: number
                  description: Maximum eCPM. Must be at least 0.01.
                  format: float
                DefaultECPM:
                  type: number
                  description: This is the eCPM an ad starts at when the Flight begins serving. During burn-in the eCPM moves from this value towards the ad's calculated eCPM as impressions accrue. Must be at least 0.01.
                  format: float
                ECPMBurnInImpressions:
                  type: integer
                  description: Impressions per creative over which the eCPM moves from the default eCPM to the calculated eCPM [1 - 2147483648].
                  format: int32
                EffectiveCPMOverride:
                  type: number
                  description: Sets a manual override to a flight's CPM, e.g. so a Flat Rate flight can compete in an auction priority.
                  format: float
                DatePartingStartTimeISO:
                  type: string
                  description: 'Targets the flight to certain hours within a day. Use ISO 8601 format: `HH:MM:SS`. *(This parameter is part of Kevel''s legacy day parting features. It is still supported, but will be ignored if a Flight has one or more new day parts. Learn more about new day parting features [here](https://dev.kevel.com/docs/day-hour-parting) and about legacy day parts [here](https://dev.kevel.com/docs/day-hour-parting-v1).)*'
                  default: 'Null'
                DatePartingEndTimeISO:
                  type: string
                  description: 'Targets the flight to certain hours within a day. Use ISO 8601 format: `HH:MM:SS`. *(This parameter is part of Kevel''s legacy day parting features. It is still supported, but will be ignored if a Flight has one or more new day parts. Learn more about new day parting features [here](https://dev.kevel.com/docs/day-hour-parting) and about legacy day parts [here](https://dev.kevel.com/docs/day-hour-parting-v1).)*'
                  default: 'Null'
                IsSunday:
                  type: boolean
                  description: If `true`, targets this day. Defaults to `false` if you have filled in the `DateParting` fields. *(This parameter is part of Kevel's legacy day parting features. It is still supported, but will be ignored if a Flight has one or more new day parts. Learn more about new day parting features [here](https://dev.kevel.com/docs/day-hour-parting) and about legacy day parts [here](https://dev.kevel.com/docs/day-hour-parting-v1).)*
                  default: false
                IsMonday:
                  type: boolean
                  description: If `true`, targets this day. Defaults to `false` if you have filled in the `DateParting` fields. *(This parameter is part of Kevel's legacy day parting features. It is still supported, but will be ignored if a Flight has one or more new day parts. Learn more about new day parting features [here](https://dev.kevel.com/docs/day-hour-parting) and about legacy day parts [here](https://dev.kevel.com/docs/day-hour-parting-v1).)*
                  default: false
                IsTuesday:
                  type: boolean
                  description: If `true`, targets this day. Defaults to `false` if you have filled in the `DateParting` fields. *(This parameter is part of Kevel's legacy day parting features. It is still supported, but will be ignored if a Flight has one or more new day parts. Learn more about new day parting features [here](https://dev.kevel.com/docs/day-hour-parting) and about legacy day parts [here](https://dev.kevel.com/docs/day-hour-parting-v1).)*
                  default: false
                IsWednesday:
                  type: boolean
                  description: If `true`, targets this day. Defaults to `false` if you have filled in the `DateParting` fields. *(This parameter is part of Kevel's legacy day parting features. It is still supported, but will be ignored if a Flight has one or more new day parts. Learn more about new day parting features [here](https://dev.kevel.com/docs/day-hour-parting) and about legacy day parts [here](https://dev.kevel.com/docs/day-hour-parting-v1).)*
                  default: false
                IsThursday:
                  type: boolean
                  description: If `true`, targets this day. Defaults to `false` if you have filled in the `DateParting` fields. *(This parameter is part of Kevel's legacy day parting features. It is still supported, but will be ignored if a Flight has one or more new day parts. Learn more about new day parting features [here](https://dev.kevel.com/docs/day-hour-parting) and about legacy day parts [here](https://dev.kevel.com/docs/day-hour-parting-v1).)*
                  default: false
                IsFriday:
                  type: boolean
                  description: If `true`, targets this day. Defaults to `false` if you have filled in the `DateParting` fields. *(This parameter is part of Kevel's legacy day parting features. It is still supported, but will be ignored if a Flight has one or more new day parts. Learn more about new day parting features [here](https://dev.kevel.com/docs/day-hour-parting) and about legacy day parts [here](https://dev.kevel.com/docs/day-hour-parting-v1).)*
                  default: false
                IsSaturday:
                  type: boolean
                  description: If `true`, targets this day. Defaults to `false` if you have filled in the `DateParting` fields. *(This parameter is part of Kevel's legacy day parting features. It is still supported, but will be ignored if a Flight has one or more new day parts. Learn more about new day parting features [here](https://dev.kevel.com/docs/day-hour-parting) and about legacy day parts [here](https://dev.kevel.com/docs/day-hour-parting-v1).)*
                  default: false
                IsArchived:
                  type: boolean
                  description: Specifies whether flight is archived.
                  default: false
                RequireStrictLocation:
                  type: boolean
                  description: If true, the ad request needs exact longitude and latitude in order to use GeoDistance targeting settings.
                  default: false
                TimeZone:
                  type: string
                  description: Sets a [supported IANA time zone string](https://dev.kevel.com/docs/time-zones-1#available-time-zones-strings) to be used for the flight's daily caps, daily goals, and day parting. Note that even if a non-UTC  `TimeZone` is set, start and end dates will still be in UTC.
                  default: '"UTC"'
                IsTargetingOptimization:
                  type: boolean
                  description: Legacy parameter
                TargetingOptimizationType:
                  type: integer
                  description: Legacy parameter
                  format: int32
                TargetingOptimizationTargetType:
                  type: integer
                  description: Legacy parameter
                  format: int32
                TargetingOptimizationTarget:
                  type: number
                  description: Legacy parameter
                  format: float
                TargetingOptimizationBurnIn:
                  type: integer
                  description: Legacy parameter
                  format: int32
                TargetingOptimizationCanMiss:
                  type: boolean
                  description: Legacy parameter
                TargetROAS:
                  type: number
                  description: For CPC/CPA/CPM auctions, a target return can be selected on ad spend (ROAS) goal and the decision engine will automatically adjust the CPC/CPA/CPM bid to try to achieve the goal set. Acceptable values are expressed as a decimal between 0.01–99.99. This is equivalent to 1%–9,999%.
                  default: null
                  format: float
                BidModifiers:
                  type: array
                  description: See [Bid Modifiers documentation](https://dev.kevel.com/docs/bid-modifiers#how-to-configure-bid-modifiers-using-the-management-api) for example usage.
                  items:
                    properties:
                      Match:
                        type: object
                        properties:
                          Keyword:
                            type: string
                          Site:
                            type: integer
                            format: int32
                          Zone:
                            type: integer
                            format: int32
                          Segment:
                            type: integer
                            format: int32
                          SearchTerm:
                            type: object
                            properties:
                              Term:
                                type: string
                          Category:
                            type: object
                            description: 'Match the category the ad request sends in `placements[].category`. The match is exact and case-sensitive after Kevel trims spaces from the start and end, and a parent category does not match its children. A category match never makes an Ad eligible: it changes the bid of an Ad that is already eligible. Kevel accepts and applies a category match whether or not category targeting is enabled for your network.'
                            required:
                            - Id
                            properties:
                              Id:
                                type: string
                                description: The category, a string of 1 to 200 characters after trimming.
                    type: object
                SiteZoneTargeting:
                  type: array
                  items:
                    properties:
                      SiteID:
                        type: integer
                        description: ID of targeted site
                        format: int32
                      ZoneID:
                        type: integer
                        description: ID of targeted zone
                        format: int32
                      IsExclude:
                        type: boolean
                        description: Whether or not the site is included or excluded
                    type: object
                Geotargeting:
                  type: array
                  items:
                    properties:
                      CountryCode:
                        type: string
                        description: The 2-3 character string that denotes the country you want to target
                      Region:
                        type: string
                        description: The 2-3 character string that denotes the region (or state) that you want to target
                      MetroCode:
                        type: integer
                        description: The 3 digit number that denotes the metropolitan area you want to target. US only.
                        format: int32
                      City:
                        type: string
                        description: The name of the city you want to target
                      CityGeonameId:
                        type: integer
                        description: The numeric geoname ID that denotes the city you want to target. This is the value matched for city targeting. Retrieve valid IDs from the List Cities in Region endpoint.
                        format: int32
                      IsExclude:
                        type: boolean
                        description: If leave blank, this will default to `false/null` and target the country. If you want to exclude it instead, use `true`
                        default: false
                    type: object
                SegmentTargeting:
                  type: array
                  items:
                    properties:
                      SegmentId:
                        type: integer
                        format: int32
                        description: ID of the targeted Segment
                      IsExclude:
                        type: boolean
                        default: 'false'
                    type: object
                CategoryTargeting:
                  type: array
                  description: The category targeting rules for the Flight. Each entry has an `Id`, the category to match, and `IsExclude`, which is `true` for an exclude rule and `false` for an include rule. Both keys are required. An `Id` can appear only once in the list, including once as an include and once as an exclude, otherwise the request returns a 400 with "CategoryTargeting includes duplicate Id values, or it may be null." A Flight can hold up to 25 rules unless Kevel raises the limit for your network. A longer list returns a 400 with "Your account has exceeded the limit for CategoryTargeting on this flight. Please contact support." Set the field to `null` or `[]` to remove the rules. If category targeting is not enabled for your network, Kevel ignores the field on writes and leaves it out of responses, and a malformed value still returns a 400. See [Set up category targeting](doc:set-up-category-targeting).
                  items:
                    type: object
                    required:
                    - Id
                    - IsExclude
                    properties:
                      Id:
                        type: string
                        description: The category to match, written exactly as your ad requests send it in `placements[].category`. Kevel trims spaces from the start and end when it saves the value, and matching is exact and case-sensitive. A parent category does not match its children. The value is a string of 1 to 200 characters.
                      IsExclude:
                        type: boolean
                        description: '`true` for an exclude rule, `false` for an include rule.'
                AttributionView:
                  type: object
                  description: The post-view attribution settings for this Flight. Set to `null` to disable. Learn more about [Kevel's attribution functionality](doc:attribution-overview).
                  properties:
                    MatchType:
                      type: string
                      description: The relationship between the purchased and advertised product. This choice represents the broadest acceptable match. Kevel will attempt to match purchases at the most specific level first (same product) and then look for broader shopper touch points up to this value.
                      enum:
                      - SameProduct
                      - SameCategoryBrand
                      - SameBrand
                      - SameMerchant
                    LookbackWindow:
                      type: string
                      description: The eligible time period (days) between a sales transaction and an ad event.
                      enum:
                      - '1'
                      - '7'
                      - '14'
                      - '30'
                    MatchMerchant:
                      type: boolean
                      description: If true, Kevel will only attribute sales that align with the selected `MatchType` _and_ the merchant(s) set via `AttributableItems` on Ads in this Flight must also match.
                      default: false
                AttributionClick:
                  type: object
                  description: The post-click attribution settings for this Flight. Set to `null` to disable. Learn more about [Kevel's attribution functionality](doc:attribution-overview).
                  properties:
                    MatchType:
                      type: string
                      description: The relationship between the purchased and advertised product. This choice represents the broadest acceptable match. Kevel will attempt to match purchases at the most specific level first (same product) and then look for broader shopper touch points up to this value.
                      enum:
                      - SameProduct
                      - SameCategoryBrand
                      - SameBrand
                      - SameMerchant
                    LookbackWindow:
                      type: string
                      description: The eligible time period (days) between a sales transaction and an ad event.
                      enum:
                      - '1'
                      - '7'
                      - '14'
                      - '30'
                    MatchMerchant:
                      type: boolean
                      description: If true, Kevel will only attribute sales that align with the selected `MatchType` _and_ the merchant(s) set via `AttributableItems` on Ads in this Flight must also match.
                      default: false
                SearchTerms:
                  type: object
                  description: See [Search Term Targeting](doc:search-term-targeting).
                  properties:
                    Term:
                      type: string
                      description: The term to match against
                    IsExclude:
                      type: boolean
                      description: Indicate whether the term should positively (false) or negatively (true)
                      default: false
                    MatchType:
                      type: string
                      default: '"Broad"'
                      enum:
                      - '"Broad"'
                      - '"Strict"'
                      - '"Exact"'
                AttributionSettings:
                  type: object
                  description: Specify the products, categories, brands, and/or merchants that make a purchase eligible for attribution to Ads in this Flight. See [Attribution Overview](doc:attribution-overview) for more details.
                  properties:
                    AttributableItems:
                      type: array
            examples:
              JSON:
                value:
                  Name: Basic Flight
                  StartDateISO: '2017-05-01'
                  EndDateISO: '2017-12-31'
                  CampaignId: 1234
                  PriorityId: 1234
                  GoalType: 1
                  Impressions: 10000
                  RateType: 2
                  Price: 5
                  CapType: 1
                  DailyCapAmount: 5000
                  LifetimeCapAmount: 50000
                  IsActive: true
                  Keywords: exercise
                  CustomTargeting: null
                  GeoTargeting: null
                  SiteZoneTargeting: null
                  IsFreqCap: true
                  FreqCap: 2
                  FreqCapDuration: 10
                  FreqCapType: 1
                  DontAffectParentFreqCap: true
                  IsCompanion: true
                  IsNoDuplicates: false
                  IsTrackingConversions: true
                  CanPassback: true
                  PassbackSortOrder: 1
                  IsArchived: false
                  IsSunday: true
                  IsMonday: false
                  IsTuesday: false
                  IsWednesday: false
                  IsThursday: false
                  IsFriday: false
                  IsSaturday: true
                  TimeZone: America/New_York
                  IsECPMOptimized: true
                  ECPMOptimizePeriod: 30
                  ECPMMultiplier: 1.25
                  FloorECPM: 0.15
                  CeilingECPM: 0.35
                  DefaultECPM: 0.28
                  ECPMBurnInImpressions: 1000
                  BehavioralTargeting:
                    onClick:
                      stopShowingAdsFromFlight: true
                      stopShowingAdsFromAdvertiser: true
                      storeCategoriesFromFlightAsInterest: true
                    onConvert:
                      stopShowingAdsFromFlight: true
                      stopShowingAdsFromAdvertiser: true
                      storeCategoriesFromFlightAsInterest: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"Id\": 1234,\n  \"StartDateISO\": \"2017-05-01T00:00:00.0000000\",\n  \"EndDateISO\": \"2017-12-31T00:00:00.0000000\",\n  \"NoEndDate\": false,\n  \"Price\": 5,\n  \"Impressions\": 10000,\n  \"IsNoDuplicates\": false,\n  \"IsCompanion\": true,\n  \"Keywords\": \"exercise\",\n  \"Name\": \"Basic Flight\",\n  \"IsFreqCap\": true,\n  \"CampaignId\": 1234,\n  \"PriorityId\": 1234,\n  \"DeliveryStatus\": 0,\n  \"IsDeleted\": false,\n  \"IsActive\": true,\n  \"GeoTargeting\": [\n    {\n      \"CountryCode\": \"US\",\n      \"Region\": \"NC\",\n      \"MetroCode\": 560,\n      \"City\": \"Durham\",\n      \"CityGeonameId\": 4464368,\n      \"IsExclude\": false\n    }\n  ],\n  \"SiteZoneTargeting\": [\n    {\n      \"SiteId\": 123,\n      \"ZoneId\": 321,\n      \"IsExclude\": false\n    }\n  ],\n  \"CustomTargeting\": null,\n  \"SegmentTargting\": [\n    {\n      \"FlightId\": 1234,\n      \"SegmentId\": 567,\n      \"IsExclude\": false,\n      \"Id\": 5195,\n      \"Segment\": {\n        \"Description\": \"\",\n        \"Reach\": null,\n        \"Id\": 567,\n        \"Source\": null,\n        \"Name\": \"Age 25-34\",\n        \"Category\": \"Age Demographics\"\n      }\n    }\n  ],\n  \"GoalType\": 1,\n  \"RateType\": 2,\n  \"IsECPMOptimized\": true,\n  \"ECPMOptimizePeriod\": 30,\n  \"ECPMMultiplier\": 1.25,\n  \"FloorECPM\": 0.15,\n  \"CeilingECPM\": 0.35,\n  \"DefaultECPM\": 0.28,\n  \"ECPMBurnInImpressions\": 1000,\n  \"EffectiveCPMOverride\": null,\n  \"DatePartingStartTimeISO\": null,\n  \"DatePartingEndTimeISO\": null,\n  \"IsSunday\": true,\n  \"IsMonday\": false,\n  \"IsTuesday\": false,\n  \"IsWednesday\": false,\n  \"IsThursday\": false,\n  \"IsFriday\": false,\n  \"IsSaturday\": true,\n  \"TimeZone\": \"America/New_York\",\n  \"FreqCap\": 2,\n  \"FreqCapDuration\": 10,\n  \"FreqCapType\": 1,\n  \"CapType\": 1,\n  \"DailyCapAmount\": 5000,\n  \"LifetimeCapAmount\": 50000,\n  \"CustomFieldsJson\": null,\n  \"BehavioralTargeting\": {\n    \"onClick\": {\n      \"stopShowingAdsFromFlight\": true,\n      \"stopShowingAdsFromAdvertiser\": true,\n      \"storeCategoriesFromFlightAsInterest\": true\n    },\n    \"onConvert\": {\n      \"stopShowingAdsFromFlight\": true,\n      \"stopShowingAdsFromAdvertiser\": true,\n      \"storeCategoriesFromFlightAsInterest\": true\n    }\n  },\n  \"IsArchived\": null,\n  \"IsTrackingConversions\": true,\n  \"RequireStrictLocation\": false,\n  \"CanPassback\": true,\n\"PassbackSortOrder\":[\n  }              "
              schema:
                type: object
                properties:
                  Id:
                    type: integer
                    example: 1234
                    default: 0
                  StartDateISO:
                    type: string
                    example: '2017-05-01T00:00:00.0000000'
                  EndDateISO:
                    type: string
                    example: '2017-12-31T00:00:00.0000000'
                  NoEndDate:
                    type: boolean
                    example: false
                    default: true
                  Price:
                    type: integer
                    example: 5
                    default: 0
                  Impressions:
                    type: integer
                    example: 10000
                    default: 0
                  IsNoDuplicates:
                    type: boolean
                    example: false
                    default: true
                  IsCompanion:
                    type: boolean
                    example: true
                    default: true
                  Keywords:
                    type: string
                    example: exercise
                  Name:
                    type: string
                    example: Basic Flight
                  IsFreqCap:
                    type: boolean
                    example: true
                    default: true
                  CampaignId:
                    type: integer
                    example: 1234
                    default: 0
                  PriorityId:
                    type: integer
                    example: 1234
                    default: 0
                  DeliveryStatus:
                    type: integer
                    example: 0
                    default: 0
                  IsDeleted:
                    type: boolean
                    example: false
                    default: true
                  IsActive:
                    type: boolean
                    example: true
                    default: true
                  GeoTargeting:
                    type: array
                    items:
                      type: object
                      properties:
                        CountryCode:
                          type: string
                          example: US
                        Region:
                          type: string
                          example: NC
                        MetroCode:
                          type: integer
                          example: 560
                          default: 0
                        City:
                          type: string
                          example: Durham
                        CityGeonameId:
                          type: integer
                          example: 4464368
                          default: 0
                        IsExclude:
                          type: boolean
                          example: false
                          default: true
