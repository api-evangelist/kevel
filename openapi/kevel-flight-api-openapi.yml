                  type: integer
                  description: The ID of the Flight
                  format: int32
                Name:
                  type: string
                  description: The name of the Flight
                StartDateISO:
                  type: string
                  description: 'Start date in ISO 8601 format: `YYYY-MM-DDTHH:MM:SS.SSSSSSS`. You can also just use `YYYY-MM-DD`'
                EndDateISO:
                  type: string
                  description: 'End date in ISO 8601 format: `YYYY-MM-DDTHH:MM:SS.SSSSSSS`. You can also just use `YYYY-MM-DD`'
                NoEndDate:
                  type: boolean
                  description: If flight has no specified End Date, set to `true`
                CampaignId:
                  type: integer
                  description: The ID of the campaign
                  format: int32
                PriorityId:
                  type: integer
                  description: The ID of the Priority
                  format: int32
                GoalType:
                  type: integer
                  description: 'This is the metric that Kevel uses to pace the ads so it hits the desired goal by the end date.  Key follows: `1 = Impressions 2 = Percentage 3 = Click 7 = Conversion 8 = Revenue 9 = Daily Revenue  10 = Monthly Revenue`. Instructions are [here](doc:flights#goals)'
                  format: int32
                Impressions:
                  type: integer
                  description: The Goal Amount
                  format: int32
                IsActive:
                  type: boolean
                  description: Active/inactive state of the flight
                IsDeleted:
                  type: boolean
                  description: If want to delete, set to `true`
                IsArchived:
                  type: boolean
                  description: Specifies whether flight is archived.
                  default: false
